# Terminal (truecolor is auto-detected from Ghostty's xterm-ghostty terminfo)
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10

# Windows & panes: start at 1, no gaps, open in current directory
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Copy mode: vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Rose Pine Moon theme
set -g status-style "bg=#393552,fg=#e0def4"
set -g status-left "#[bg=#3e8fb0,fg=#232136,bold] #S #[bg=#393552] "
set -g status-right "#[bg=#393552,fg=#6e6a86] %H:%M #[bg=#c4a7e7,fg=#232136,bold] #h "
set -g status-left-length 30
set -g status-right-length 40
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[fg=#9ccfd8,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#9ccfd8"
set -g message-style "bg=#2a273f,fg=#e0def4"
set -g message-command-style "bg=#2a273f,fg=#e0def4"
set -g mode-style "bg=#44415a,fg=#e0def4"

# Session persistence: resurrect saves layout + cwd + scrollback, continuum
# autosaves every 15 min and restores on tmux start (e.g. after a reboot).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Re-launch Claude Code panes resuming their last conversation
set -g @resurrect-processes '"~claude->claude --continue"'

if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run ~/.tmux/plugins/tpm/tpm"
