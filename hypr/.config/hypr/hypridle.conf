general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank the display after 10 minutes of idle by dimming the backlight to 0
# over DDC/CI, and freeze the video wallpaper. See ~/.local/bin/ddc-display-idle.
# We deliberately avoid both `hyprctl dispatch dpms off` (DRM hot-unplug crashes
# Hyprland on amdgpu+HDMI) and DDC power-off (VCP D6 — the monitor's DDC goes
# unresponsive in standby, so wake is unreliable and the screen can stick off).
listener {
    timeout = 600
    on-timeout = ~/.local/bin/ddc-display-idle off
    on-resume = ~/.local/bin/ddc-display-idle on
}
